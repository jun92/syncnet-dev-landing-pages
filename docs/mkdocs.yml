site_name: 눈오는밤 | SyncnetPlatform
site_url: https://syncnet.dev
site_description: Free Core Game Backend Engine & Enterprise Customization Support

theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: slate
    primary: indigo
    accent: cyan
  features:
    - navigation.instant

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html

extra_css:
  - stylesheets/teaser.css
extra_javascript:
  - javascripts/teaser.js
